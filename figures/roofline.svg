<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img" aria-label="Roofline chart for RTX 3090">
  <title>Roofline model for RTX 3090</title>
  <desc>Log-log plot. Memory roof rises with slope 1 until it meets the compute roof at AI ≈ 38 FLOP/byte. FP32 GEMM at 3072³ has AI ≈ 512 and sits in the compute-bound region.</desc>

  <!-- axes -->
  <line x1="60" y1="380" x2="640" y2="380" stroke="#5F5E5A" stroke-width="1"/>
  <line x1="60" y1="40"  x2="60"  y2="380" stroke="#5F5E5A" stroke-width="1"/>

  <!-- x ticks -->
  <g font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">
    <line x1="60"  y1="380" x2="60"  y2="384" stroke="#5F5E5A"/><text x="60"  y="398">0.1</text>
    <line x1="176" y1="380" x2="176" y2="384" stroke="#5F5E5A"/><text x="176" y="398">1</text>
    <line x1="292" y1="380" x2="292" y2="384" stroke="#5F5E5A"/><text x="292" y="398">10</text>
    <line x1="408" y1="380" x2="408" y2="384" stroke="#5F5E5A"/><text x="408" y="398">100</text>
    <line x1="524" y1="380" x2="524" y2="384" stroke="#5F5E5A"/><text x="524" y="398">1000</text>
    <line x1="640" y1="380" x2="640" y2="384" stroke="#5F5E5A"/><text x="640" y="398">10000</text>
    <text x="350" y="425" font-size="13">arithmetic intensity (FLOP/byte)</text>
  </g>

  <!-- y ticks -->
  <g font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">
    <line x1="56" y1="349" x2="60" y2="349" stroke="#5F5E5A"/><text x="52" y="353">0.1</text>
    <line x1="56" y1="246" x2="60" y2="246" stroke="#5F5E5A"/><text x="52" y="250">1</text>
    <line x1="56" y1="143" x2="60" y2="143" stroke="#5F5E5A"/><text x="52" y="147">10</text>
    <line x1="56" y1="40"  x2="60" y2="40"  stroke="#5F5E5A"/><text x="52" y="44">100</text>
  </g>
  <text x="20" y="210" font-family="sans-serif" font-size="13" fill="#5F5E5A" text-anchor="middle" transform="rotate(-90 20 210)">attainable throughput (TFLOP/s)</text>

  <!-- compute ceiling -->
  <line x1="60" y1="86.3" x2="640" y2="86.3" stroke="#993C1D" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="630" y="78" font-family="sans-serif" font-size="11" fill="#993C1D" text-anchor="end">compute roof — 35.58 TFLOP/s</text>

  <!-- memory roof -->
  <line x1="60" y1="352" x2="359.3" y2="86.3" stroke="#185FA5" stroke-width="2"/>
  <text x="220" y="240" font-family="sans-serif" font-size="11" fill="#185FA5" transform="rotate(-37 220 240)">memory roof — 936.2 GB/s</text>

  <!-- ridge -->
  <rect x="354" y="81" width="11" height="11" fill="#5F5E5A"/>
  <text x="370" y="78" font-family="sans-serif" font-size="11" fill="#5F5E5A">ridge ≈ 38 FLOP/byte</text>

  <!-- GEMM point -->
  <circle cx="490.2" cy="86.3" r="6" fill="#0F6E56"/>
  <text x="490.2" y="108" font-family="sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle">GEMM 3072³ (AI ≈ 512)</text>

  <!-- regime labels -->
  <text x="180" y="160" font-family="sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">memory-bound</text>
  <text x="540" y="160" font-family="sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">compute-bound</text>
</svg>
